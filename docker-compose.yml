services:
  postgres:
    image: postgres:16
    container_name: taskminder-postgres
    restart: always
    environment:
      POSTGRES_USER: taskminder
      POSTGRES_PASSWORD: 66£@BZuI9FVi
      POSTGRES_DB: taskminder_workspace
    ports:
      - "5432:5432"
    volumes:
      - taskminder_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taskminder-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  taskminder_postgres_data:
